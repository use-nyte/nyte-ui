name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Node CI
    uses: use-nyte/.github/.github/workflows/ci-node.yml@v1.1.1
    with:
      run-build: true
      run-tests: true
      run-typecheck: true
      run-lint: true
      run-format: true

  release:
    name: Release UI Packages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ci
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      packages: write
    secrets:
      NYTE_AUTOMATION_PRIVATE_KEY: ${{ secrets.NYTE_AUTOMATION_PRIVATE_KEY }}
